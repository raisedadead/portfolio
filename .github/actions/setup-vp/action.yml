name: 'Setup Vite+'
description: 'Sets up Vite+ and Node.js, then installs dependencies'

runs:
  using: 'composite'
  steps:
    - name: Install Vite+, Node.js from .node-version and dependencies
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        run-install: |
          args: ['--frozen-lockfile']
