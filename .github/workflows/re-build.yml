name: Build

on: [workflow_call]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp

      - name: Build
        run: vp run build
        env:
          CI: true
