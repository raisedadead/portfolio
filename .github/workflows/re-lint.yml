name: Lint

on: [workflow_call]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp

      - name: Run astro check
        run: vp run check
        env:
          CI: true

      - name: Run lint
        run: vp run lint
        env:
          CI: true
