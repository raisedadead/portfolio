name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/re-lint.yml
    secrets: inherit

  test:
    name: Test
    uses: ./.github/workflows/re-test.yml
    secrets: inherit

  build:
    name: Build
    needs: [lint, test]
    uses: ./.github/workflows/re-build.yml
    with:
      upload-artifacts: true
    secrets: inherit
