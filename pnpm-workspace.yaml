allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true
  '@sentry/cli': false
  better-sqlite3: false
minimumReleaseAgeStrict: true
trustLockfile: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.1
  vite-plus: 1.7.0
  '@vitest/coverage-v8': 5.1.1
  '@vitest/ui': 5.1.1
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: '*'
